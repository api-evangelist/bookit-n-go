      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        countryCallingCode: { type: string }
        countryOfResidence: { type: string }
    FlightBookingInput:
      type: object
      required: [offerId, travellers, contact]
      properties:
        offerId: { type: string }
