    ActionReceipt:
      $ref: "#/components/schemas/AgentAction"
    ActionReceiptResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: "#/components/schemas/ActionReceipt" } } }
    WebhookInput:
      type: object
      required: [url, eventTypes]
      properties:
        url: { type: string, format: uri, pattern: "^https://" }
        eventTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [flight.booking.created, flight.booking.updated, hotel.booking.created, hotel.booking.updated, trip.created, trip.item.added, hotel.booking.cancelled, servicing.action.completed, servicing.action.unknown] }
    WebhookEvent:
      type: object
      description: Signed canonical JSON. Receivers should reject timestamps older than five minutes and deduplicate by id. Transient failures retry at most five times.
      required: [id, type, apiVersion, timestamp, data, app, tenant]
      properties:
        id: { type: string }
        type: { type: string, enum: [flight.booking.created, flight.booking.updated, hotel.booking.created, hotel.booking.updated, trip.created, trip.item.added, hotel.booking.cancelled, servicing.action.completed, servicing.action.unknown] }
        apiVersion: { type: string, const: "1" }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          description: Event-specific public data. The populated member is selected by type.
          additionalProperties: false
          properties:
            booking:
              type: object
              additionalProperties: false
              required: [id, kind, status]
              properties:
                id: { type: string }
                kind: { type: string, enum: [FLIGHT, HOTEL] }
                status: { type: string, enum: [PENDING, CONFIRMED, FAILED] }
            trip: { $ref: "#/components/schemas/Trip" }
            item: { $ref: "#/components/schemas/TripItem" }
            action: { $ref: "#/components/schemas/ServicingAction" }
        app: { type: object, required: [id], properties: { id: { type: string } } }
        tenant: { type: object, required: [id], properties: { id: { type: string } } }
