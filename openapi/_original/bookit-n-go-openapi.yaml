# x-archived-from: bookit-n-go-openapi.yaml
# x-archived-on: 2026-10-02
openapi: 3.1.0
info:
  title: ZOE API by Bookit N Go
  version: 1.0.0
  license: { name: Proprietary }
  description: |
    Versioned external API for deterministic ZOE sandbox flight, hotel, trip, and servicing workflows by Bookit N Go.
    Sandbox booking operations never execute live supplier or payment mutations.
security:
  - SandboxApiKey: []
tags:
  - { name: Trips, description: "Sandbox trip grouping and hotel servicing workflows" }
  - { name: Flights, description: "Sandbox flight search, validation, fare, and booking operations" }
  - { name: Hotels, description: "Sandbox hotel search, validation, and booking operations" }
  - { name: Webhooks, description: "App-scoped webhook endpoint configuration and delivery history" }
  - { name: Travelers, description: "App-scoped traveler profiles, preferences, constraints, and consent" }
  - { name: Agent, description: "Supplier-neutral, consent-bound agent actions and receipts" }
paths:
  /travelers/profiles:
    post:
      operationId: publicCreateTravelerProfile
      summary: Create a traveler profile
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TravelerProfileInput" } } } }
      responses:
        "201": { description: Profile created, content: { application/json: { schema: { $ref: "#/components/schemas/TravelerProfileResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /travelers/profiles/{profileId}:
    parameters: [{ $ref: "#/components/parameters/ProfileId" }]
    get:
      operationId: publicGetTravelerProfile
      summary: Retrieve a traveler profile
      tags: [Travelers]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/TravelerProfileResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: publicUpdateTravelerProfile
      summary: Update a traveler profile
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TravelerProfilePatch" } } } }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/TravelerProfileResponse" } } } }
  /travelers/profiles/{profileId}/preferences:
    get:
      operationId: publicListTravelerPreferences
      summary: List contextual preferences
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }]
      responses: { "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/PreferenceListResponse" } } } } }
    put:
      operationId: publicReplaceTravelerPreferences
      summary: Replace contextual preferences
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PreferenceInput" } } } } }
      responses: { "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/PreferenceListResponse" } } } } }
  /travelers/profiles/{profileId}/constraints:
    get:
      operationId: publicListTravelerConstraints
      summary: List deterministic constraints (separate from preferences)
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }]
      responses: { "200": { description: Constraints, content: { application/json: { schema: { $ref: "#/components/schemas/ConstraintListResponse" } } } } }
    put:
      operationId: publicReplaceTravelerConstraints
      summary: Replace deterministic constraints
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConstraintInput" } } } } }
      responses: { "200": { description: Constraints, content: { application/json: { schema: { $ref: "#/components/schemas/ConstraintListResponse" } } } } }
  /travelers/profiles/{profileId}/consents:
    get:
      operationId: publicListTravelerConsents
      summary: List consent history
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }]
      responses: { "200": { description: Consent history, content: { application/json: { schema: { $ref: "#/components/schemas/ConsentListResponse" } } } } }
    post:
      operationId: publicGrantTravelerConsent
      summary: Grant explicit consent
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConsentGrantInput" } } } }
      responses: { "201": { description: Consent granted, content: { application/json: { schema: { $ref: "#/components/schemas/ConsentResponse" } } } } }
  /travelers/profiles/{profileId}/consents/{consentId}/revoke:
    post:
      operationId: publicRevokeTravelerConsent
      summary: Revoke consent; revoked consent fails closed
      tags: [Travelers]
      parameters: [{ $ref: "#/components/parameters/ProfileId" }, { $ref: "#/components/parameters/ConsentId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [actor, confirmed], properties: { actor: { type: string, minLength: 1 }, confirmed: { type: boolean, const: true } } } } } }
      responses: { "200": { description: Consent revoked, content: { application/json: { schema: { $ref: "#/components/schemas/ConsentResponse" } } } } }
  /agent/actions/prepare:
    post:
      operationId: publicPrepareAgentAction
      summary: Prepare a supplier-neutral booking action
      tags: [Agent]
      description: Preparation does not book, charge, or contact a supplier.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentActionInput" } } } }
      responses: { "200": { description: Prepared action, content: { application/json: { schema: { $ref: "#/components/schemas/AgentActionResponse" } } } } }
  /agent/actions/{receiptId}/execute:
    post:
      operationId: publicExecuteAgentAction
      summary: Execute a confirmed agent action
      tags: [Agent]
      description: Only HOTEL_CANCEL may execute. Booking preparation actions are preparation-only.
      parameters: [{ $ref: "#/components/parameters/ReceiptId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentExecuteInput" } } } }
      responses: { "200": { description: Durable action receipt, content: { application/json: { schema: { $ref: "#/components/schemas/ActionReceiptResponse" } } } }, "202": { description: Unknown outcome; inspect receipt } }
  /agent/receipts/{receiptId}:
    get:
      operationId: publicGetAgentReceipt
      summary: Retrieve an agent action receipt
      tags: [Agent]
      parameters: [{ $ref: "#/components/parameters/ReceiptId" }]
      responses: { "200": { description: Receipt, content: { application/json: { schema: { $ref: "#/components/schemas/ActionReceiptResponse" } } } } }
  /trips:
    get:
      operationId: publicListTrips
      summary: List trips
      tags: [Trips]
      responses:
        "200": { description: Trips visible to the authenticated app, content: { application/json: { schema: { $ref: "#/components/schemas/TripListResponse" }, example: { data: [{ id: "trip_01JTRIP", name: "Vancouver weekend", createdAt: "2026-01-15T12:00:00Z", updatedAt: "2026-01-15T12:00:00Z", items: [] }] } } } }
    post:
      operationId: publicCreateTrip
      summary: Create a trip
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
            example: { name: "Vancouver weekend" }
      responses:
        "201": { description: Trip created, content: { application/json: { schema: { $ref: "#/components/schemas/TripResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /trips/{tripId}:
    get:
      operationId: publicGetTrip
      summary: Retrieve a trip and its items
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      responses:
        "200": { description: Trip, content: { application/json: { schema: { $ref: "#/components/schemas/TripResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /trips/{tripId}/items:
    post:
      operationId: publicAddTripItem
      summary: Add an existing booking to a trip
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripItemInput" }
            example: { bookingId: "book_hotel_01", kind: HOTEL }
      responses:
        "201": { description: Trip item added, content: { application/json: { schema: { $ref: "#/components/schemas/TripItemResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /trips/{tripId}/items/{itemId}/servicing/cancellation-preview:
    post:
      operationId: publicCreateCancellationPreview
      summary: Preview hotel cancellation
      tags: [Trips]
      description: Returns a deterministic sandbox estimate. It does not contact a supplier or issue a refund. Previews expire at expiresAt and must not be used after expiry.
      parameters:
        - { $ref: "#/components/parameters/TripId" }
        - { $ref: "#/components/parameters/TripItemId" }
      responses:
        "200": { description: Cancellation preview, content: { application/json: { schema: { $ref: "#/components/schemas/CancellationPreviewResponse" }, example: { data: { previewId: "prev_01", tripId: "trip_01JTRIP", itemId: "item_01", kind: HOTEL, termsHash: "sha256:abc", refundable: true, refundEstimate: { amount: 120, currency: CAD }, penaltyEstimate: null, expiresAt: "2026-01-15T12:10:00Z" } } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /trips/{tripId}/items/{itemId}/servicing/cancel:
    post:
      operationId: publicCancelTripItem
      summary: Cancel a hotel trip item
      tags: [Trips]
      description: Sandbox-only deterministic cancellation. The estimate is not a live refund. FLIGHT servicing is unsupported in this tranche. Use the same key to safely replay an ambiguous request.
      parameters:
        - { $ref: "#/components/parameters/TripId" }
        - { $ref: "#/components/parameters/TripItemId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancellationInput" }
            example: { previewId: "prev_01", termsHash: "sha256:abc", confirmed: true }
      responses:
        "200": { description: Deterministic completion or exact idempotent replay, headers: { Idempotent-Replayed: { schema: { type: string, const: "true" }, description: "Present only for an exact replay." } }, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResponse" } } } }
        "202": { description: Outcome is UNKNOWN and requires receipt inspection; do not blind retry, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResponse" } } } }
        "409": { description: Idempotency conflict or stale terms, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "410": { description: Preview expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /trips/{tripId}/servicing/actions/{actionId}:
    get:
      operationId: publicGetServicingAction
      summary: Retrieve a servicing action receipt
      tags: [Trips]
      parameters:
        - { $ref: "#/components/parameters/TripId" }
        - { $ref: "#/components/parameters/ActionId" }
      responses:
        "200": { description: Action receipt, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks:
    post:
      operationId: publicCreateWebhook
      summary: Register a webhook endpoint
      tags: [Webhooks]
      description: The signingSecret is returned only by this response.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookInput" } } } }
      responses:
        "201": { description: Webhook endpoint and one-time signing secret }
        "400": { $ref: "#/components/responses/Error" }
    get:
      operationId: publicListWebhooks
      summary: List app webhook endpoints (secrets redacted)
      tags: [Webhooks]
      responses:
        "200": { description: App-scoped endpoint list }
        "401": { $ref: "#/components/responses/Error" }
  /webhooks/{webhookId}:
    delete:
      operationId: publicDeleteWebhook
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks/{webhookId}/rotate-secret:
    post:
      operationId: publicRotateWebhookSecret
      summary: Rotate and return a signing secret once
      tags: [Webhooks]
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "200": { description: Endpoint and one-time replacement signing secret }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks/{webhookId}/deliveries:
    get:
      operationId: publicListWebhookDeliveries
      summary: List delivery status for an endpoint
      tags: [Webhooks]
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "200": { description: Delivery history including attempt counts }
        "404": { $ref: "#/components/responses/Error" }
  /flights/search:
    post:
      operationId: publicSearchFlights
      summary: Search sandbox flight offers
      tags: [Flights]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FlightSearch" } } } }
      responses:
        "200": { description: Normalized sandbox offers, content: { application/json: { schema: { $ref: "#/components/schemas/FlightOfferList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /recommendations/flights:
    post:
      operationId: publicRankFlights
      summary: Deterministically rank flight offers for a traveler
      tags: [Flights]
      description: Read-only hard-filter then weighted ranking. REQUIRED preferences are never traded away; missing fields are UNEVALUABLE.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationRequest" } } } }
      responses: { "200": { description: Ranked offers and durable receipt, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationResponse" } } } } }
  /recommendations/hotels:
    post:
      operationId: publicRankHotels
      summary: Deterministically rank hotel offers for a traveler
      tags: [Hotels]
      description: Read-only hard-filter then weighted ranking. REQUIRED preferences are never traded away; missing fields are UNEVALUABLE.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationRequest" } } } }
      responses: { "200": { description: Ranked offers and durable receipt, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationResponse" } } } } }
  /recommendations/receipts/{receiptId}:
    get:
      operationId: publicGetRecommendationReceipt
      summary: Retrieve a durable recommendation receipt
      tags: [Agent]
      parameters: [{ $ref: "#/components/parameters/ReceiptId" }]
      responses: { "200": { description: Recommendation receipt, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationReceiptResponse" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /flights/{offerId}/revalidate:
    post:
      operationId: publicRevalidateFlight
      summary: Revalidate a sandbox flight offer
      tags: [Flights]
      parameters: [{ $ref: "#/components/parameters/OfferId" }]
      responses:
        "200": { description: Revalidation result }
        "401": { $ref: "#/components/responses/Error" }
  /flights/{offerId}/fare-rules:
    get:
      operationId: publicGetFlightFareRules
      summary: Retrieve normalized flight fare rules
      tags: [Flights]
      parameters: [{ $ref: "#/components/parameters/OfferId" }]
      responses:
        "200": { description: Normalized fare rules }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /flights/bookings:
    post:
      operationId: publicCreateFlightBooking
      summary: Create a sandbox flight booking
      tags: [Flights]
      description: Creates a sandbox booking. Reusing the same key and body returns the original booking; reusing it with a different body returns 409.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FlightBookingInput" } } } }
      responses:
        "201": { description: Sandbox booking created, content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } } }
        "200": { description: Idempotent replay, headers: { Idempotent-Replayed: { schema: { type: string, const: "true" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /flights/bookings/{bookingId}:
    get:
      operationId: publicGetFlightBooking
      summary: Retrieve a sandbox flight booking
      tags: [Flights]
      parameters: [{ $ref: "#/components/parameters/BookingId" }]
      responses:
        "200": { description: Sandbox flight booking, content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /hotels/search:
    post:
      operationId: publicSearchHotels
      summary: Search sandbox hotel offers
      tags: [Hotels]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HotelSearch" } } } }
      responses:
        "200": { description: Normalized sandbox offers }
        "400": { $ref: "#/components/responses/Error" }
  /hotels/{offerId}/revalidate:
    post:
      operationId: publicRevalidateHotel
      summary: Revalidate a sandbox hotel offer
      tags: [Hotels]
      parameters: [{ $ref: "#/components/parameters/OfferId" }]
      responses:
        "200": { description: Revalidation result }
        "401": { $ref: "#/components/responses/Error" }
  /hotels/bookings:
    post:
      operationId: publicCreateHotelBooking
      summary: Create a sandbox hotel booking
      tags: [Hotels]
      description: Creates a deterministic sandbox booking with durable duplicate protection.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HotelBookingInput" } } } }
      responses:
        "201": { description: Sandbox booking created, content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } } }
        "200": { description: Idempotent replay }
        "409": { $ref: "#/components/responses/Error" }
  /hotels/bookings/{bookingId}:
    get:
      operationId: publicGetHotelBooking
      summary: Retrieve a sandbox hotel booking
      tags: [Hotels]
      parameters: [{ $ref: "#/components/parameters/BookingId" }]
      responses:
        "200": { description: Sandbox hotel booking, content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
webhooks:
  bookingStatus:
    post:
      operationId: receiveZoeBookingStatusWebhook
      summary: Signed booking-status event delivered to a registered app endpoint
      tags: [Webhooks]
      parameters:
        - { name: X-ZOE-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: X-ZOE-Event, in: header, required: true, schema: { type: string } }
        - { name: X-ZOE-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-ZOE-Signature, in: header, required: true, schema: { type: string, pattern: "^v1=[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "200": { description: Event accepted by the consumer }
        "400": { description: Consumer rejected the event }
components:
  securitySchemes:
    SandboxApiKey:
      type: http
      scheme: bearer
      description: ZOE API sandbox credential (zoe_sandbox_ prefix). X-API-Key is also accepted.
  parameters:
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ConsentId: { name: consentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ReceiptId: { name: receiptId, in: path, required: true, schema: { type: string, minLength: 1 } }
    TripId: { name: tripId, in: path, required: true, schema: { type: string } }
    TripItemId: { name: itemId, in: path, required: true, schema: { type: string } }
    ActionId: { name: actionId, in: path, required: true, schema: { type: string } }
    OfferId: { name: offerId, in: path, required: true, schema: { type: string } }
    BookingId: { name: bookingId, in: path, required: true, schema: { type: string } }
    WebhookId: { name: webhookId, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }
  responses:
    Error:
      description: Public API error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    Provenance:
      type: object
      additionalProperties: false
      required: [source, observedAt, method]
      properties:
        source: { type: string, minLength: 1 }
        observedAt: { type: string, format: date-time }
        method: { type: string, enum: [DECLARED, OBSERVED, IMPORTED] }
        confidence: { type: number, minimum: 0, maximum: 1 }
    TravelContext:
      type: object
      additionalProperties: false
      properties:
        tripPurpose: { type: string, enum: [BUSINESS, LEISURE, BLEISURE, OTHER] }
        geography: { type: string, minLength: 1 }
        season: { type: string, minLength: 1 }
        companions: { type: string, enum: [SOLO, PARTNER, FAMILY, COLLEAGUES, GROUP] }
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [profileId, offerIds]
      properties:
        profileId: { type: string, minLength: 1 }
        offerIds: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        context: { $ref: "#/components/schemas/TravelContext" }
    RecommendationEvidence:
      type: object
      required: [category, status, strength, weight, freshness]
      properties:
        preferenceId: { type: string }
        category: { type: string }
        value: {}
        status: { type: string, enum: [MATCHED, NOT_MATCHED, UNEVALUABLE, REQUIRED_VIOLATION] }
        strength: { type: string, enum: [REQUIRED, STRONG, PREFERRED, FLEXIBLE] }
        weight: { type: number }
        provenance: {}
        freshness: { type: string }
        context: { $ref: "#/components/schemas/TravelContext" }
    RecommendationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [receiptId, kind, results, receipt]
          properties:
            receiptId: { type: string }
            kind: { type: string, enum: [FLIGHT, HOTEL] }
            results:
              type: array
              items:
                type: object
                required: [offer, score, evidence]
                properties:
                  offer: { type: object }
                  score: { type: number }
                  evidence: { type: array, items: { $ref: "#/components/schemas/RecommendationEvidence" } }
            receipt: { type: object }
    RecommendationReceiptResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [receiptId, version, candidates, decision, rules]
          properties:
            receiptId: { type: string }
            version: { type: string }
            candidates: { type: array, items: { type: object } }
            decision: { type: object }
            rules: { type: object }
    TravelerProfileInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        contact: { $ref: "#/components/schemas/TravelerContact" }
        loyalty: { type: array, items: { type: object, additionalProperties: false, required: [program, memberId], properties: { program: { type: string }, memberId: { type: string } } } }
    TravelerProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, provenance, preferences, constraints, createdAt, updatedAt]
      properties:
        id: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 200 }
