        itemId: { type: string }
        kind: { type: string, enum: [HOTEL] }
        operation: { type: string, const: HOTEL_CANCELLATION }
        previewId: { type: string }
        termsHash: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, UNKNOWN, FAILED] }
        refundEstimate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        penaltyEstimate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        estimateOnly: { type: boolean, const: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ActionResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/ServicingAction" } }
    Money:
      type: object
      required: [amount, currency]
      properties: { amount: { type: number, minimum: 0 }, currency: { type: string, minLength: 3, maxLength: 3 } }
    FlightSearch:
      type: object
      required: [origin, destination, departureDate, tripType, adults]
      properties:
        origin: { type: string, minLength: 3, maxLength: 3 }
        destination: { type: string, minLength: 3, maxLength: 3 }
        departureDate: { type: string, format: date }
        returnDate: { type: string, format: date }
        tripType: { type: string, enum: [ONE_WAY, ROUND_TRIP] }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0, default: 0 }
        infants: { type: integer, minimum: 0, default: 0 }
        cabin: { type: string, enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST], default: ECONOMY }
        currency: { type: string, default: CAD }
    HotelSearch:
      type: object
      required: [destination, checkIn, checkOut, rooms, adults]
      properties:
        destination: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rooms: { type: integer, minimum: 1 }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0, default: 0 }
        currency: { type: string, default: CAD }
        nationality: { type: string, default: CA }
        occupancies:
          type: array
          minItems: 1
          description: Room-level occupancy. Preserve one item per room and provide one age for each child.
          items:
            type: object
            required: [adults, children, childAges]
            properties:
              adults: { type: integer, minimum: 1 }
              children: { type: integer, minimum: 0 }
              childAges:
                type: array
                items: { type: integer, minimum: 0, maximum: 17 }
