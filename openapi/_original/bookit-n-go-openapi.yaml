      type: object
      additionalProperties: false
      required: [id, bookingId, kind, createdAt, bookingStatus, servicing]
      properties:
        id: { type: string }
        bookingId: { type: string }
        kind: { type: string, enum: [HOTEL, FLIGHT] }
        createdAt: { type: string, format: date-time }
        bookingStatus: { type: string, enum: [PENDING, CONFIRMED, FAILED, CANCELLED, UNKNOWN] }
        servicing: { $ref: "#/components/schemas/TripItemServicing" }
    TripItemServicing:
      type: object
      additionalProperties: false
      required: [cancellation]
      properties:
        cancellation: { type: string, enum: [SUPPORTED, UNSUPPORTED, UNAVAILABLE] }
    TripListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: "#/components/schemas/Trip" } } }
    TripResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/Trip" } }
    TripItemResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/TripItem" } }
    CancellationInput:
