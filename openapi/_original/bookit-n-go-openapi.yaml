      properties:
        id: { type: string }
        scope: { type: string, enum: [PROFILE_READ, PROFILE_WRITE, PREFERENCE_WRITE, BOOKING_PREPARE, BOOKING_EXECUTE, SERVICING_EXECUTE] }
        actor: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }
        status: { type: string, enum: [GRANTED, REVOKED, EXPIRED] }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        effective: { type: boolean }
    TravelerProfileResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: "#/components/schemas/TravelerProfile" } } }
    PreferenceListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Preference" } } } }
    ConstraintListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Constraint" } } } }
    ConsentListResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Consent" } } } }
    ConsentResponse: { type: object, additionalProperties: false, required: [data], properties: { data: { $ref: "#/components/schemas/Consent" } } }
    AgentActionInput:
      oneOf:
        - $ref: "#/components/schemas/HotelCancelActionInput"
        - $ref: "#/components/schemas/FlightBookingPrepareActionInput"
        - $ref: "#/components/schemas/HotelBookingPrepareActionInput"
      discriminator:
        propertyName: action
        mapping:
          HOTEL_CANCEL: "#/components/schemas/HotelCancelActionInput"
          FLIGHT_BOOKING_PREPARE: "#/components/schemas/FlightBookingPrepareActionInput"
          HOTEL_BOOKING_PREPARE: "#/components/schemas/HotelBookingPrepareActionInput"
    HotelCancelActionInput:
      type: object
      additionalProperties: false
      required: [profileId, action, intent, actor]
      properties:
        profileId: { type: string }
        action: { type: string, const: HOTEL_CANCEL }
        intent: { $ref: "#/components/schemas/HotelCancelIntent" }
        actor: { type: string, minLength: 1 }
    FlightBookingPrepareActionInput:
      type: object
      additionalProperties: false
      required: [profileId, action, intent, actor]
      properties:
        profileId: { type: string }
        action: { type: string, const: FLIGHT_BOOKING_PREPARE }
        intent: { $ref: "#/components/schemas/FlightBookingPrepareIntent" }
        actor: { type: string, minLength: 1 }
    HotelBookingPrepareActionInput:
      type: object
      additionalProperties: false
      required: [profileId, action, intent, actor]
      properties:
        profileId: { type: string }
        action: { type: string, const: HOTEL_BOOKING_PREPARE }
        intent: { $ref: "#/components/schemas/HotelBookingPrepareIntent" }
        actor: { type: string, minLength: 1 }
    AgentAction:
      type: object
      additionalProperties: false
      required: [receiptId, profileId, action, status, requiredScopes, evaluation, actor, idempotencyKey, outcome, servicingReceiptId, createdAt, updatedAt]
      properties:
        receiptId: { type: string }
        profileId: { type: string }
        action: { type: string, enum: [HOTEL_CANCEL, FLIGHT_BOOKING_PREPARE, HOTEL_BOOKING_PREPARE] }
        status: { type: string, enum: [PREPARED, IN_PROGRESS, COMPLETED, FAILED, UNKNOWN] }
        requiredScopes: { type: array, items: { type: string } }
        evaluation: { type: object, additionalProperties: false, required: [constraints, freshPreferences], properties: { constraints: { type: string, enum: [PASS, FAIL] }, freshPreferences: { type: string, enum: [APPLIED, IGNORED] } } }
        actor: { type: string }
        idempotencyKey: { type: string }
        outcome: { type: object, additionalProperties: true }
        servicingReceiptId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
