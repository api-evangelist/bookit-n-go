        category: { type: string, const: BUDGET }
        operator: { type: string, const: LTE }
        value: { type: number, minimum: 0 }
        provenance: { $ref: "#/components/schemas/Provenance" }
        effectiveUntil: { type: string, format: date-time }
    AirlineConstraintInput:
      type: object
