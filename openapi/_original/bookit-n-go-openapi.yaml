        value: { oneOf: [{ type: string }, { type: array, minItems: 1, items: { type: string } }] }
        priority: { type: integer, minimum: 0, maximum: 100 }
        strength: { type: string, enum: [REQUIRED, STRONG, PREFERRED, FLEXIBLE] }
