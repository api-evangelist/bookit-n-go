      additionalProperties: false
      properties:
        previewId: { type: string }
        termsHash: { type: string }
        confirmed: { type: boolean, const: true }
    CancellationPreview:
      type: object
      required: [previewId, tripId, itemId, kind, termsHash, refundable, refundEstimate, penaltyEstimate, expiresAt]
      properties:
        previewId: { type: string }
        tripId: { type: string }
        itemId: { type: string }
        kind: { type: string, const: HOTEL }
        termsHash: { type: string, description: "Hash of the cancellation terms accepted by the caller." }
        refundable: { type: boolean }
        refundEstimate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "Estimate only; no refund is issued by this API." }
        penaltyEstimate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        expiresAt: { type: string, format: date-time }
    CancellationPreviewResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/CancellationPreview" } }
    ServicingAction:
      type: object
