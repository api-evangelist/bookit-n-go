              lastName: { type: string }
              dateOfBirth: { type: string, format: date }
    HotelBookingInput:
      type: object
      required: [offerId, holder, rooms, contact]
      properties:
        offerId: { type: string }
        acceptedTotal: { $ref: "#/components/schemas/Money" }
        holder:
          type: object
          required: [name, surname]
          properties: { name: { type: string }, surname: { type: string } }
        contact: { $ref: "#/components/schemas/Contact" }
        rooms:
          type: array
          minItems: 1
          items:
            type: object
            required: [guests]
            properties:
              guests:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [type, name, surname]
                  properties: { type: { type: string, enum: [AD, CH] }, name: { type: string }, surname: { type: string }, age: { type: integer } }
    Booking:
      type: object
      required: [id, type, status, offerId, environment, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [flight_booking, hotel_booking] }
        status: { type: string, enum: [PENDING, CONFIRMED, FAILED] }
        offerId: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        environment: { type: string, const: SANDBOX }
        createdAt: { type: string, format: date-time }
    BookingResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/Booking" } }
    FlightOfferList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        meta: { type: object, properties: { environment: { type: string, const: SANDBOX } } }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, requestId: { type: [string, "null"] }, details: {} }