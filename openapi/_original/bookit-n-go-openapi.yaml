        operator: { type: string, enum: [LTE, EQ, IN, NOT_IN] }
        value: {}
        provenance: { $ref: "#/components/schemas/Provenance" }
        effectiveUntil: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConsentGrantInput:
      type: object
      additionalProperties: false
      required: [scope, actor, provenance, confirmed]
      properties:
        scope: { type: string, enum: [PROFILE_READ, PROFILE_WRITE, PREFERENCE_WRITE, BOOKING_PREPARE, BOOKING_EXECUTE, SERVICING_EXECUTE] }
        expiresAt: { type: string, format: date-time }
